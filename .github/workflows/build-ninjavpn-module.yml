name: Build Ninja VPN Unrestrict Module

on:
  push:
    paths:
      - 'module/**'
      - '.github/workflows/build-ninjavpn-module.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip module
        run: |
          cd module
          zip -r ../unrestrict_ninjavpn.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: unrestrict_ninjavpn
          path: unrestrict_ninjavpn.zip

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ninjavpn-build-${{ github.run_number }}
          name: Unrestrict Ninja VPN ${{ github.run_number }}
          files: unrestrict_ninjavpn.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
