name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison ca-certificates curl flex \
            libssl-dev libelf-dev python3 python3-pip python3-dev \
            git zip unzip build-essential libncurses-dev \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Setup Neutron Clang
        run: |
          mkdir -p clang
          cd clang
          curl -LO https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman
          chmod +x antman
          ./antman -S
          echo "$(pwd)/bin" >> $GITHUB_PATH

      - name: Set environment
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "KBUILD_BUILD_USER=chenoomassekali" >> $GITHUB_ENV
          echo "KBUILD_BUILD_HOST=github-actions" >> $GITHUB_ENV

      - name: Fix Python2 syntax in build scripts
        run: |
          sed -i -E 's/^(\s*)print (.+)$/\1print(\2)/' scripts/gcc-wrapper.py

      - name: Fix implicit int declaration in smp.c
        run: |
          sed -i 's/^extern in_long_press;/extern int in_long_press;/' arch/arm64/kernel/smp.c

      - name: Fix missing prototype in hwconf_manager.c
        run: |
          sed -i 's/static char \*hw_item_dump()/static char *hw_item_dump(void)/' arch/arm64/kernel/hwconf_manager.c

      - name: Check for RTL88XXAU driver in tree
        run: |
          echo "Searching for RTL88XXAU / RTL8812AU / RTL8821AU driver source..."
          grep -ril "RTL8812AU\|RTL8821AU\|RTL88XXAU" drivers/net/wireless/ 2>/dev/null || echo "NOT FOUND: driver source not present in tree"
          find . -iname "*rtl88*" -o -iname "*8812au*" -o -iname "*8821au*" 2>/dev/null | head -20

      - name: Build kernel
        run: |
          export PATH="${{ github.workspace }}/clang/bin:$PATH"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export HOSTCFLAGS="-fcommon"

          mkdir -p $HOME/cross-as
          ln -sf $(command -v aarch64-linux-gnu-as) $HOME/cross-as/as
          export CC="clang --target=aarch64-linux-gnu- -B$HOME/cross-as"

          make O=out ARCH=arm64 CC="clang --target=aarch64-linux-gnu- -B$HOME/cross-as" HOSTCFLAGS="-fcommon" lmi_user_defconfig

          # Enable BBR congestion control
          ./scripts/config --file out/.config -e TCP_CONG_ADVANCED
          ./scripts/config --file out/.config -e TCP_CONG_BBR
          ./scripts/config --file out/.config -e NET_SCH_FQ
          ./scripts/config --file out/.config --set-str DEFAULT_TCP_CONG bbr

          make O=out ARCH=arm64 CC="clang --target=aarch64-linux-gnu- -B$HOME/cross-as" HOSTCFLAGS="-fcommon" olddefconfig

          make -j$(nproc) O=out ARCH=arm64 \
            CC="clang --target=aarch64-linux-gnu- -B$HOME/cross-as" \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            HOSTCFLAGS="-fcommon" \
            2>&1 | tee build.log

      - name: Check build output
        run: |
          if [ ! -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "Build failed, Image.gz-dtb not found"
            exit 1
          fi

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AK3
          rm -rf AK3/.git

      - name: Package kernel
        run: |
          cp out/arch/arm64/boot/Image.gz-dtb AK3/ || true
          cp out/arch/arm64/boot/dtbo.img AK3/ || true
          cd AK3
          zip -r9 ../lmi-kernel-${{ github.run_number }}.zip . -x '.git*'

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: lmi-kernel-${{ github.run_number }}
          path: lmi-kernel-${{ github.run_number }}.zip
