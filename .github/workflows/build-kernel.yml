name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: MiCode/Xiaomi_Kernel_OpenSource
          ref: lmi-q-oss
          submodules: recursive

      - name: Clone device tree repo (terpisah dari kernel source)
        run: |
          git clone --depth=1 --branch lmi-q-oss https://github.com/MiCode/kernel_devicetree.git /tmp/kernel_devicetree
          echo "----- Isi kernel_devicetree -----"
          ls -la /tmp/kernel_devicetree/

      - name: Merge device tree ke dalam kernel source
        run: |
          mkdir -p arch/arm64/boot/dts/vendor
          cp -r /tmp/kernel_devicetree/* arch/arm64/boot/dts/vendor/
          echo "----- Isi arch/arm64/boot/dts/vendor setelah merge -----"
          ls -la arch/arm64/boot/dts/vendor/
          echo "----- Cek folder xiaomi/lmi -----"
          find arch/arm64/boot/dts/vendor -iname "*lmi*"

      - name: Fix Makefile tab/space issues in device tree
        run: |
          echo "----- Memperbaiki indentasi Makefile (spasi -> TAB) di folder vendor -----"
          find arch/arm64/boot/dts/vendor -name "Makefile" | while read -r mkfile; do
            echo "Memproses: $mkfile"
            sed -i 's/^        /\t/' "$mkfile"
          done
          echo "----- Verifikasi arch/arm64/boot/dts/vendor/qcom/Makefile baris 23 -----"
          sed -n '20,26p' arch/arm64/boot/dts/vendor/qcom/Makefile | cat -A | head -10

      - name: Verify top-level dts Makefile includes vendor
        run: |
          echo "----- Isi arch/arm64/boot/dts/Makefile -----"
          cat arch/arm64/boot/dts/Makefile
          if ! grep -q "vendor" arch/arm64/boot/dts/Makefile; then
            echo "PERINGATAN: Makefile top-level belum reference folder vendor, menambahkan fallback"
            sed -i '1i subdir-y += vendor' arch/arm64/boot/dts/Makefile
          fi

      - name: Remove problematic non-lmi dtb targets
        run: |
          echo "----- Menghapus kona-rumi.dts yang tidak relevan dan menyebabkan build error -----"
          find arch/arm64/boot/dts/vendor/qcom -iname "*rumi*" -exec rm -v {} \;
          echo "----- Cek Makefile qcom, hapus referensi rumi kalau ada -----"
          grep -rn "rumi" arch/arm64/boot/dts/vendor/qcom/Makefile || echo "tidak ada referensi rumi di Makefile"
          if grep -q "rumi" arch/arm64/boot/dts/vendor/qcom/Makefile 2>/dev/null; then
            sed -i '/rumi/d' arch/arm64/boot/dts/vendor/qcom/Makefile
            echo "Baris referensi rumi dihapus dari Makefile"
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison ca-certificates curl flex \
            libssl-dev libelf-dev python3 python3-pip python3-dev \
            git zip unzip build-essential libncurses-dev \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Setup Neutron Clang
        run: |
          mkdir -p clang
          cd clang
          curl -LO https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman
          chmod +x antman
          ./antman -S
          echo "$(pwd)/bin" >> $GITHUB_PATH

      - name: Set environment
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "KBUILD_BUILD_USER=chenoomassekali" >> $GITHUB_ENV
          echo "KBUILD_BUILD_HOST=github-actions" >> $GITHUB_ENV

      - name: Fix Python2 syntax in build scripts
        run: |
          sed -i -E 's/^(\s*)print (.+)$/\1print(\2)/' scripts/gcc-wrapper.py

      - name: Fix implicit int declaration in smp.c
        run: |
          sed -i 's/^extern in_long_press;/extern int in_long_press;/' arch/arm64/kernel/smp.c 2>/dev/null || echo "smp.c fix tidak diperlukan/tidak ditemukan, skip"

      - name: Fix missing prototype in hwconf_manager.c
        run: |
          sed -i 's/static char \*hw_item_dump()/static char *hw_item_dump(void)/' arch/arm64/kernel/hwconf_manager.c 2>/dev/null || echo "hwconf_manager.c fix tidak diperlukan/tidak ditemukan, skip"

      - name: Fix missing prototypes in xiaomi_touch.c
        run: |
          sed -i \
            -e 's/struct class \*get_xiaomi_touch_class()/struct class *get_xiaomi_touch_class(void)/' \
            -e 's/struct device \*get_xiaomi_touch_dev()/struct device *get_xiaomi_touch_dev(void)/' \
            drivers/input/touchscreen/xiaomi/xiaomi_touch.c 2>/dev/null || echo "xiaomi_touch.c fix tidak diperlukan/tidak ditemukan, skip"

      - name: Fix gsi.c modversion relocation error (jika ada)
        run: |
          if [ -f drivers/platform/msm/gsi/gsi.c ]; then
            sed -i 's/static union __packed gsi_channel_scratch/static union gsi_channel_scratch/' drivers/platform/msm/gsi/gsi.c
            grep -n "static union gsi_channel_scratch __gsi_update_mhi_channel_scratch" drivers/platform/msm/gsi/gsi.c
          else
            echo "gsi.c tidak ditemukan di tree ini, skip fix"
          fi

      - name: Check for RTL88XXAU driver in tree
        run: |
          echo "Searching for RTL88XXAU / RTL8812AU / RTL8821AU driver source..."
          grep -ril "RTL8812AU\|RTL8821AU\|RTL88XXAU" drivers/net/wireless/ 2>/dev/null || echo "NOT FOUND: driver source not present in tree"
          find . -iname "*rtl88*" -o -iname "*8812au*" -o -iname "*8821au*" 2>/dev/null | head -20

      - name: Build kernel
        run: |
          export PATH="${{ github.workspace }}/clang/bin:$PATH"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export HOSTCFLAGS="-fcommon"
          export KCFLAGS="-Wno-error=unused-but-set-variable -Wno-error=unused-variable -Wno-error=implicit-fallthrough"

          mkdir -p $HOME/cross-as
          ln -sf $(command -v aarch64-linux-gnu-as) $HOME/cross-as/as
          export CC="clang --target=aarch64-linux-gnu- -B$HOME/cross-as"

          make O=out ARCH=arm64 CC="clang --target=aarch64-linux-gnu- -B$HOME/cross-as" LD=ld.lld HOSTCFLAGS="-fcommon" lmi_user_defconfig

          # Enable BBR congestion control
          ./scripts/config --file out/.config -e TCP_CONG_ADVANCED
          ./scripts/config --file out/.config -e TCP_CONG_BBR
          ./scripts/config --file out/.config -e NET_SCH_FQ
          ./scripts/config --file out/.config --set-str DEFAULT_TCP_CONG bbr

          make O=out ARCH=arm64 CC="clang --target=aarch64-linux-gnu- -B$HOME/cross-as" LD=ld.lld HOSTCFLAGS="-fcommon" olddefconfig

          make -j1 O=out ARCH=arm64 \
            CC="clang --target=aarch64-linux-gnu- -B$HOME/cross-as" \
            LD=ld.lld \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            HOSTCFLAGS="-fcommon" \
            KCFLAGS="$KCFLAGS" \
            2>&1 | tee build.log
          make -j1 O=out ARCH=arm64 \
            CC="clang --target=aarch64-linux-gnu- -B$HOME/cross-as" \
            LD=ld.lld \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            HOSTCFLAGS="-fcommon" \
            KCFLAGS="$KCFLAGS" \
            Image.gz-dtb \
            2>&1 | tee build.log
          echo "----- Build dtbs (device tree dari kernel_devicetree repo) -----"
          make -j1 O=out ARCH=arm64 \
            CC="clang --target=aarch64-linux-gnu- -B$HOME/cross-as" \
            LD=ld.lld \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            HOSTCFLAGS="-fcommon" \
            KCFLAGS="$KCFLAGS" \
            dtbs \
            2>&1 | tee -a build.log

      - name: Check build output
        run: |
          if [ ! -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "Build failed, Image.gz-dtb not found"
            exit 1
          fi
          echo "----- Cek DTB/dtbo hasil build -----"
          find out/arch/arm64/boot -iname "*lmi*"
          find out/arch/arm64/boot -iname "*.dtb" | head -20
          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            ls -la out/arch/arm64/boot/dtbo.img
            echo "dtbo.img BERHASIL di-generate"
          else
            echo "dtbo.img tidak digabung sebagai satu file, cek .dtbo individual di atas"
          fi

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AK3
          rm -rf AK3/.git

      - name: Configure anykernel.sh for Poco F2 Pro (lmi)
        run: |
          cd AK3
          sed -i \
            -e "s/kernel.string=.*/kernel.string=LMI-Kernel by chenoomassekali @ github/" \
            -e "s/device.name1=.*/device.name1=lmi/" \
            -e "s/device.name2=.*/device.name2=lmiin/" \
            -e "s/device.name3=.*/device.name3=lmidu/" \
            -e "s/device.name4=.*/device.name4=lmide/" \
            -e "s/device.name5=.*/device.name5=/" \
            -e "s/supported.versions=.*/supported.versions=10 - 16/" \
            -e "s/IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=0;/" \
            -e "s#BLOCK=.*#BLOCK=auto;#" \
            anykernel.sh
          echo "----- Hasil konfigurasi anykernel.sh -----"
          grep -E "kernel.string|device.name|supported.versions|IS_SLOT_DEVICE|BLOCK=" anykernel.sh

      - name: Package kernel
        run: |
          cp out/arch/arm64/boot/Image.gz-dtb AK3/
          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            cp out/arch/arm64/boot/dtbo.img AK3/
            echo "dtbo.img ikut dipackage"
          else
            echo "dtbo.img tidak ada, packaging tanpa dtbo (pakai dtbo stok device)"
          fi
          cd AK3
          zip -r9 ../lmi-kernel-${{ github.run_number }}.zip . -x '.git*'

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: lmi-kernel-${{ github.run_number }}
          path: lmi-kernel-${{ github.run_number }}.zip
