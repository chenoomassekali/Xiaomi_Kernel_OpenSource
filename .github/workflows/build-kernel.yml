name: Build Kernel Modules (BBR + RTL88XXAU)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: MiCode/Xiaomi_Kernel_OpenSource
          ref: lmi-q-oss
          submodules: recursive

      - name: Cari commit paling dekat dengan tanggal build kernel stok (4 Agustus 2020)
        run: |
          TARGET_COMMIT=$(git log --before="2020-08-05" -1 --format="%H")
          echo "Commit yang dipakai: $TARGET_COMMIT"
          git log -1 "$TARGET_COMMIT"
          git checkout "$TARGET_COMMIT"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison ca-certificates curl flex \
            libssl-dev libelf-dev python3 python3-pip python3-dev \
            git zip unzip build-essential libncurses-dev \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Setup Neutron Clang
        run: |
          mkdir -p clang
          cd clang
          curl -LO https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman
          chmod +x antman
          ./antman -S
          echo "$(pwd)/bin" >> $GITHUB_PATH

      - name: Set environment
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "KBUILD_BUILD_USER=chenoomassekali" >> $GITHUB_ENV
          echo "KBUILD_BUILD_HOST=github-actions" >> $GITHUB_ENV

      - name: Fix Python2 syntax in build scripts
        run: |
          sed -i -E 's/^(\s*)print (.+)$/\1print(\2)/' scripts/gcc-wrapper.py 2>/dev/null || echo "skip"

      - name: Prepare kernel build tree (full prepare + modules_prepare)
        run: |
          export PATH="${{ github.workspace }}/clang/bin:$PATH"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export HOSTCFLAGS="-fcommon"
          export CC="clang --target=aarch64-linux-gnu-"

          make O=out ARCH=arm64 CC="$CC" LD=ld.lld HOSTCFLAGS="-fcommon" lmi_user_defconfig

          ./scripts/config --file out/.config -e TCP_CONG_ADVANCED
          ./scripts/config --file out/.config -m TCP_CONG_BBR
          ./scripts/config --file out/.config -m NET_SCH_FQ
          ./scripts/config --file out/.config -e MODULES
          ./scripts/config --file out/.config -e MODULE_UNLOAD

          make O=out ARCH=arm64 CC="$CC" LD=ld.lld HOSTCFLAGS="-fcommon" olddefconfig

          echo "----- Verifikasi config BBR sebagai module -----"
          grep "CONFIG_TCP_CONG_BBR" out/.config
          grep "CONFIG_NET_SCH_FQ" out/.config

          echo "----- Generate semua file 'generated' yang dibutuhkan (termasuk timeconst.h) -----"
          make -j$(nproc) O=out ARCH=arm64 CC="$CC" LD=ld.lld \
            CROSS_COMPILE=$CROSS_COMPILE CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            HOSTCFLAGS="-fcommon" \
            prepare 2>&1 | tee prepare.log

          echo "----- modules_prepare -----"
          make -j$(nproc) O=out ARCH=arm64 CC="$CC" LD=ld.lld \
            CROSS_COMPILE=$CROSS_COMPILE CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            HOSTCFLAGS="-fcommon" \
            modules_prepare 2>&1 | tee -a prepare.log

          echo "----- Verifikasi timeconst.h ada -----"
          find out -name "timeconst.h"

      - name: Build modul BBR (tcp_bbr.ko)
        run: |
          export PATH="${{ github.workspace }}/clang/bin:$PATH"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC="clang --target=aarch64-linux-gnu-"

          make -j$(nproc) O=out ARCH=arm64 CC="$CC" LD=ld.lld \
            CROSS_COMPILE=$CROSS_COMPILE HOSTCFLAGS="-fcommon" \
            M=net/ipv4 tcp_bbr.ko 2>&1 | tee bbr_build.log

          echo "----- Cek hasil tcp_bbr.ko -----"
          find out -name "tcp_bbr.ko"

      - name: Clone driver RTL88XXAU (aircrack-ng, kompatibel kernel 4.19)
        run: |
          git clone --depth=1 https://github.com/aircrack-ng/rtl8812au.git /tmp/rtl88xxau
          echo "----- Isi source driver -----"
          ls -la /tmp/rtl88xxau/

      - name: Build modul RTL88XXAU (88XXau.ko)
        run: |
          export PATH="${{ github.workspace }}/clang/bin:$PATH"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC="clang --target=aarch64-linux-gnu-"
          KERNEL_DIR="$(pwd)/out"
          KVER="$(cat $KERNEL_DIR/include/config/kernel.release 2>/dev/null || echo 4.19.81-perf-g7ec11a9)"
          echo "KVER yang dipakai: $KVER"

          cd /tmp/rtl88xxau
          make ARCH=arm64 CROSS_COMPILE=$CROSS_COMPILE CC="$CC" \
            KSRC="$KERNEL_DIR" \
            KVER="$KVER" \
            modules 2>&1 | tee /tmp/rtl_build.log || echo "Build RTL88XXAU selesai dengan kemungkinan warning, cek log"

          echo "----- Cek hasil modul RTL88XXAU -----"
          find /tmp/rtl88xxau -name "*.ko"

      - name: Package sebagai Magisk Module
        run: |
          mkdir -p magisk_module/system/lib/modules
          cp out/net/ipv4/tcp_bbr.ko magisk_module/system/lib/modules/ 2>/dev/null || echo "tcp_bbr.ko tidak ditemukan"
          find /tmp/rtl88xxau -name "*.ko" -exec cp {} magisk_module/system/lib/modules/ \; 2>/dev/null || echo "modul RTL88XXAU tidak ditemukan"

          echo "----- Isi folder modules sebelum packaging -----"
          ls -la magisk_module/system/lib/modules/

          cat > magisk_module/module.prop << 'EOF'
          id=lmi_bbr_wifi_modules
          name=LMI BBR + RTL88XXAU Modules
          version=v1.0
          versionCode=1
          author=chenoomassekali
          description=Modul kernel BBR congestion control dan driver RTL88XXAU untuk kernel stok lmi 4.19.81-perf-g7ec11a9
          EOF

          cat > magisk_module/service.sh << 'EOF'
          #!/system/bin/sh
          MODDIR=${0%/*}
          
          if [ -f "$MODDIR/system/lib/modules/tcp_bbr.ko" ]; then
            insmod "$MODDIR/system/lib/modules/tcp_bbr.ko" 2>/dev/null
            sysctl -w net.ipv4.tcp_congestion_control=bbr 2>/dev/null
          fi
          
          for ko in "$MODDIR"/system/lib/modules/88XXau*.ko "$MODDIR"/system/lib/modules/*rtl88*.ko; do
            if [ -f "$ko" ]; then
              insmod "$ko" 2>/dev/null
            fi
          done
          EOF
          chmod 755 magisk_module/service.sh

          touch magisk_module/skip_mount

          cd magisk_module
          zip -r9 ../lmi-bbr-wifi-module.zip . -x '.git*'
          cd ..
          echo "----- Isi paket akhir -----"
          unzip -l lmi-bbr-wifi-module.zip

      - name: Upload build logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: |
            prepare.log
            bbr_build.log
            /tmp/rtl_build.log

      - name: Upload Magisk module
        uses: actions/upload-artifact@v4
        with:
          name: lmi-bbr-wifi-module
          path: lmi-bbr-wifi-module.zip
