id=unrestrict_ninjavpn
name=Unrestrict Data - Ninja VPN
version=v1.0
versionCode=1
author=cheno
description=Menghapus pembatasan data OS Android (Data Saver, background restriction, Doze throttling) untuk Ninja VPN

#!/system/bin/sh
PKG="app.ninjavpn.android"

# Tunggu boot selesai
while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 1; done
sleep 5

UID_NUM=$(dumpsys package $PKG | grep -m1 "userId=" | sed 's/.*userId=//')

if [ -n "$UID_NUM" ]; then
  cmd netpolicy add-restrict-background-whitelist $UID_NUM
  cmd netpolicy remove-restrict-background-blacklist $UID_NUM
  cmd netpolicy set-uid-policy $UID_NUM 0
  dumpsys deviceidle whitelist +$PKG
  cmd appops set $PKG RUN_IN_BACKGROUND allow
  cmd appops set $PKG RUN_ANY_IN_BACKGROUND allow
fi

cmd netpolicy set-restrict-background false
settings put global data_saver_mode 0

log -t unrestrict_ninjavpn "Applied unrestrict policy for $PKG (uid=$UID_NUM)"
name: Build Ninja VPN Unrestrict Module

on:
  push:
    paths:
      - 'module/**'
      - '.github/workflows/build-ninjavpn-module.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip module
        run: |
          cd module
          zip -r ../unrestrict_ninjavpn.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: unrestrict_ninjavpn
          path: unrestrict_ninjavpn.zip

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ninjavpn-build-${{ github.run_number }}
          name: Unrestrict Ninja VPN ${{ github.run_number }}
          files: unrestrict_ninjavpn.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
